events{}

http {
  

  server {
    listen 80;
    server_name  localhost;

    location / {
      default_type text/html;
      return 200 '
        <h1>app1</h1>
        <a href="/app2/">Ir para App2</a><br>
        <a href="/app3/">Ir para App3</a>
      ';
      
    }

    location /app2/ {
      proxy_pass http://aplicativo2.local/;
      proxy_set_header Host $host; 
      add_header X-Container $hostname;
    }

    location /app3/ {
      proxy_pass http://aplicativo3.local/;
      proxy_set_header Host $host; 
      add_header X-Container $hostname;
    }
  }
}
services:

  dns:
    build: ./dns
    container_name: dns
    networks:
      lbnet:
        ipv4_address: 172.20.0.10

    volumes:
      - ./dns/dnsdata:/dnsdata

  app1:
    build: ./app1

    ports:
      - "8080:80"

    depends_on:
      - dns
      - app2
      - app3

    dns:
      - 172.20.0.10

    networks:
      - lbnet

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: aplicativo2
    
    dns:
      - 172.20.0.10
    volumes:
      - ./app2:/usr/share/nginx/html
      - ./dns/dnsdata:/dnsdata
    networks:
      - lbnet

  app3:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: aplicativo3
    
    dns:
      - 172.20.0.10
    volumes:
      - ./app3:/usr/share/nginx/html
      - ./dns/dnsdata:/dnsdata
    networks:
      - lbnet

networks:
  lbnet:
    ipam:
      config:
        - subnet: 172.20.0.0/24
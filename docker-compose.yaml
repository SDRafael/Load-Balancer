services:
  app1:
    build: ./app1
    ports:
      - "8080:80"
    depends_on:
      - app2
      - app3

  app2:
    build: .
    volumes:
      - ./app2:/usr/share/nginx/html
    hostname: aplicativo2
        
  app3:
    build: .
    volumes:
      - ./app3:/usr/share/nginx/html
    hostname: aplicativo3

  dsnmasq:
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf
    ports:
      - 53:53/udp
    cap_add:
      - NET_ADMIN
    networks:
      default:
        ipv4_address: 172.16.1.1